settings:
  - key: dp_dev_dashy
    type: toggle_item
    title: "dashy HUD 儀表盤"
    description: "dashy - dragonpilot 的一體化系統中心。<br><br>訪問 http://<設備IP>:5088 打開。<br><br>啟用此選項以使用特斯拉風格 HUD。"
    category: "Device"
    flags: PERSISTENT
    param_type: BOOL
    default: "0"
  - key: dp_maa_route
    category: "Device"
    flags: CLEAR_ON_MANAGER_START
    param_type: JSON
  - key: dp_maa_destination
    category: "Device"
    flags: PERSISTENT
    param_type: JSON
  - key: dp_maa_places
    category: "Device"
    flags: PERSISTENT
    param_type: JSON
