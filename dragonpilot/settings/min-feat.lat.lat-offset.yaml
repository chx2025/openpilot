settings:
  - key: dp_lat_offset_cm
    type: spin_button_item
    title: "位置偏移"
    description: "微調車輛在車道內的行駛位置。正值向左偏移，負值向右偏移。<br>建議從較小的數值（±5cm）開始，根據偏好調整。"
    category: "Lateral"
    default: 0
    min_val: -15
    max_val: 15
    step: 1
    suffix: "cm"
    flags: PERSISTENT
    param_type: INT
