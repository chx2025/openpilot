settings:
  - key: dp_lat_lca_speed
    type: spin_button_item
    title: "變道輔助速度："
    description: "關閉 = 禁用變道輔助。<br>1 mph = 1.2 km/h。"
    category: "Lateral"
    default: 20
    min_val: 0
    max_val: 100
    step: 5
    suffix: "mph"
    special_value_text: "關閉"
    on_change:
      - target: dp_lat_lca_auto_sec
        action: set_enabled
        condition: "value > 0"
    flags: PERSISTENT
    param_type: INT
    default: "20"

  - key: dp_lat_lca_auto_sec
    type: double_spin_button_item
    title: "+ 自動變道延遲："
    description: "關閉 = 禁用自動變道。"
    category: "Lateral"
    default: 0.0
    min_val: 0.0
    max_val: 5.0
    step: 0.5
    suffix: "秒"
    special_value_text: "關閉"
    initially_enabled_by:
      param: dp_lat_lca_speed
      condition: "value > 0"
      default: 20
    flags: PERSISTENT
    param_type: FLOAT
    default: "0.0"
