settings:
  - key: dp_toyota_auto_brake_hold
    type: text_spin_button_item
    title: "自動煞車維持 (TSS2)"
    description: "適用於沒有原廠 Auto Hold 的車輛。停車且巡航未啟用時，靜止滿 2 秒後借用 PCS 煞車將車輛保持在原地。踩油門即解除；再次踩下煞車會解除並重新計時。<br>關閉：停用。<br>開啟：在 D 檔即可作動。<br>速度：進入 D 檔後車速曾超過 18 公里/時 (5 m/s) 才作動。<br>需為 TSS2 相機 ACC 車型並使用 openpilot 縱向控制，重新發動車輛後生效。"
    category: "Toyota / Lexus"
    brands: ["toyota"]
    condition: "openpilotLongitudinalControl"
    default: 0
    options:
      - "關閉"
      - "開啟"
      - "速度"
    flags: PERSISTENT
    param_type: INT

  - key: dp_toyota_auto_brake_hold_force
    type: text_spin_button_item
    title: "自動煞車維持力道"
    description: "保持時使用的煞車力道。標準（-2.0 m/s²）與原始實作相同。若保持中車輛仍會往前蠕動（汽油車在 D 檔怠速有蠕行力時常見），可改用加強（-3.0）或最強（-4.0）。重新發動車輛後生效。"
    category: "Toyota / Lexus"
    brands: ["toyota"]
    condition: "openpilotLongitudinalControl"
    default: 0
    options:
      - "標準"
      - "加強"
      - "最強"
    flags: PERSISTENT
    param_type: INT
