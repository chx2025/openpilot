settings:
  - key: dp_ui_display_mode
    type: text_spin_button_item
    title: "顯示模式"
    description: "標準：默認行為。<br>MAIN+：ACC Main 開啟 = 顯示開啟。<br>OP+：OP 啟用 = 顯示開啟。<br>MAIN-：ACC Main 開啟 = 顯示關閉<br>OP-：OP 啟用 = 顯示關閉。"
    category: "UI"
    options:
      - "標準"
      - "MAIN+"
      - "OP+"
      - "MAIN-"
      - "OP-"
    flags: PERSISTENT
    param_type: INT
    default: "0"
